    <img class="imagen-receta" src="imagenes/arrozalacubana.jpg" alt="Arroz a la cubana" />

      <h2>Ingredientes (por persona)</h2>
      <ul class="ingredientes" data-comensales="1">
        <li>80 g de arroz</li>
        <li>2 lonchas de bacon</li>
        <li>1 huevo</li>
        <li>4 cucharadas de tomate frito</li>
        <li>½ plátano</li>
        <li>1 rodaja de pan para mojar</li>
      </ul>

      <div class="paso">

        </label>
      </div>
      <div class="paso">
        <input type="checkbox" id="paso2" />
        <label for="paso2">
          <b>En la sartén.</b> Freír el <mark>bacon</mark> y emplatar. Echar un chorro de
          <mark>aceite</mark> y freír el <mark>plátano</mark> cortado a la mitad y el <mark>huevo</mark>.
          Calentar el <mark>tomate frito</mark>, escurrir el <mark>arroz</mark> y emplatar todo junto.
        </label>
      </div>
    </div>
