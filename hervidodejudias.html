<body>
  <header class="cabecera con-menu">
    <a class="boton-menu" href="index.html" role="button" aria-label="Abrir el menú de recetas" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </a>
    <a class="cabecera-enlace" href="index.html">
      <img class="cabecera-rama" src="imagenes/rama.svg" alt="" aria-hidden="true" />
      <span class="cabecera-titulo"><span>Comida tradicional</span> <span>alicantina</span></span>
      <img class="cabecera-castillo" src="imagenes/castillo.svg" alt="" aria-hidden="true" />
    </a>
  </header>

  <div class="titulo-receta">
    <a class="volver" href="index.html">‹ Todas las recetas</a>
    <h1>Hervido de judías</h1>
  </div>

  <div class="receta-wrapper">

    <div class="carrusel" aria-roledescription="carrusel" aria-label="Fotos de la receta">
      <div class="carrusel-pista">
        <img class="imagen-receta" src="imagenes/hervidodejudias.jpg" alt="Hervido de judías (1 de 2)" />
        <img class="imagen-receta" src="imagenes/hervidodejudias2.jpg" alt="Hervido de judías (2 de 2)" loading="lazy" />
      </div>
    </div>

    <div class="card-ingredientes">
      <h2>Ingredientes</h2>
      <ul class="ingredientes" data-comensales="2">
        <li>300 g de judías verdes</li>
        <li>1 zanahoria</li>
        <li>1 patata</li>
        <li>1 cebolleta</li>
        <li>2 hojas de laurel</li>
        <li>1 cubo de caldo de verduras</li>
      </ul>
    </div>

    <div class="card-instrucciones">
      <h2>Preparación</h2>
      <div class="paso">
        <input type="checkbox" id="paso1" />
        <label for="paso1">
          <b>En una olla a presión.</b> Hervir <mark>todos los ingredientes</mark> a trozos
          10 minutos con un par de dedos de <mark>agua</mark>.
        </label>
      </div>
      <div class="paso">
        <input type="checkbox" id="paso2" />
        <label for="paso2">
          <b>Servir.</b> Aliñar con <mark>aceite, vinagre y sal</mark>.
        </label>
      </div>
    </div>

  </div>

  <footer class="pie-ondas">
    <img src="imagenes/ondas.svg" alt="" aria-hidden="true" />
  </footer>
