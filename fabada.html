  <div class="titulo-receta">
    <a class="volver" href="index.html">‹ Todas las recetas</a>
    <h1>Fabada con alubias de bote</h1>
  </div>

  <div class="receta-wrapper">

    <div class="card-ingredientes">
      <h2>Ingredientes</h2>
      <ul class="ingredientes" data-sin-comensales>
        <li>Alubias de bote</li>
        <li>1 paquete de compango</li>
        <li>Cebolla</li>
        <li>Ajo</li>
        <li>Pimentón</li>
        <li>Laurel</li>
        <li>Aceite de oliva</li>
      </ul>
    </div>

    <div class="card-instrucciones">
      <h2>Preparación</h2>

      <div class="paso">
        <input type="checkbox" id="paso1" />
        <label for="paso1">
          <b>La base.</b> En la olla, a fuego medio-bajo, con un chorrito de <mark>aceite</mark>, sofríe la <mark>cebolla</mark> y el <mark>ajo</mark> suavemente, sin dorar. Apaga el fuego, añade el <mark>pimentón</mark> y remueve rápido.
        </label>
      </div>

      <div class="paso">
        <input type="checkbox" id="paso2" />
        <label for="paso2">
          <b>El compango.</b> Añade el <mark>compango</mark> y el <mark>laurel</mark> y cubre justo con agua. Tapa la olla (sin presión) y cuece a fuego muy suave <mark>45–60 minutos</mark>: casi no debe hervir, solo borbotear.
        </label>
      </div>

      <div class="paso">
        <input type="checkbox" id="paso3" />
        <label for="paso3">
          <b>Las alubias.</b> Escurre y aclara ligeramente las <mark>alubias</mark>, añádelas a la olla y ajusta de agua, solo hasta cubrir.
        </label>
      </div>

      <div class="paso">
        <input type="checkbox" id="paso4" />
        <label for="paso4">
          <b>Cocción final lenta.</b> Con la olla tapada y a fuego muy suave, <mark>30–40 minutos</mark>. Mueve la olla en vaivén de vez en cuando, sin cuchara, para que no se rompan.
        </label>
      </div>

      <div class="paso">
        <input type="checkbox" id="paso5" />
        <label for="paso5">
          <b>Reposo (clave).</b> Apaga el fuego y deja reposar <mark>mínimo 30 minutos</mark>. Lo ideal es 1–2 horas, o incluso hasta la hora de comer.
        </label>
      </div>

    </div>

  </div><!-- /receta-wrapper -->
