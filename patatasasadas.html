  <div class="titulo-receta">
    <a class="volver" href="index.html">‹ Todas las recetas</a>
    <h1>Patatas asadas</h1>
  </div>

  <div class="receta-wrapper">

    <img class="imagen-receta" src="imagenes/patatasasadas.jpg" alt="Patatas asadas" />

    <div class="card-ingredientes">
      <h2>Ingredientes</h2>
      <ul class="ingredientes" data-comensales="2">
        <li>Patatas</li>
        <li>Boniato (opcional)</li>
        <li>Sal</li>
        <li>Aceite de oliva</li>
        <li>Para servir: alioli y pimienta o pimentón (opcional)</li>
      </ul>
    </div>

    <div class="card-instrucciones">
      <h2>Preparación</h2>

      <div class="paso">
        <input type="checkbox" id="paso1" />
        <label for="paso1">
          <b>Precalentar el horno.</b> Ponerlo a <mark>220 °C</mark>.
        </label>
      </div>

      <div class="paso">
        <input type="checkbox" id="paso2" />
        <label for="paso2">
          <b>Cortar las patatas.</b> Si son pequeñas, <mark>por la mitad</mark>. Si son muy grandes, en <mark>rodajas de 2 cm</mark> de grosor (salen unas tres por patata). Si hay algún <mark>boniato</mark>, se corta igual y se asa junto a las patatas: el tiempo de horno es parecido.
        </label>
      </div>

      <div class="paso">
        <input type="checkbox" id="paso3" />
        <label for="paso3">
          <b>Hacer los cuadritos.</b> Con un cuchillo, marcar la cara cortada en <mark>cuadrícula</mark>, lo más profundo que se pueda.
        </label>
      </div>

      <div class="paso">
        <input type="checkbox" id="paso4" />
        <label for="paso4">
          <b>Aliñar.</b> Echar <mark>sal</mark> y <mark>aceite de oliva</mark> por encima.
        </label>
      </div>

      <div class="paso">
        <input type="checkbox" id="paso5" />
        <label for="paso5">
          <b>Al horno.</b> Poner la bandeja en uno de los <mark>niveles de abajo</mark> y dejar unos <mark>40 minutos</mark>.
        </label>
      </div>

      <div class="paso">
        <input type="checkbox" id="paso6" />
        <label for="paso6">
          <b>Punto.</b> Están hechas cuando los <mark>cuadrados empiezan a abrirse</mark>, como en la foto.
        </label>
      </div>

      <div class="paso">
        <input type="checkbox" id="paso7" />
        <label for="paso7">
          <b>Servir.</b> Se pueden acompañar con un <mark>sobrecito de alioli</mark> y un poco de <mark>pimienta o pimentón</mark> por encima.
        </label>
      </div>

    </div>

  </div><!-- /receta-wrapper -->
