  <title>Carrilleras al vino tinto – Comida tradicional alicantina</title>

  <link rel="stylesheet" href="style.css?v=20261122d" />
</head>
<body>

  <header class="cabecera con-menu">
    <a class="boton-menu" href="index.html" role="button" aria-label="Abrir el menú de recetas" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </a>
    <a class="cabecera-enlace" href="index.html">
      <img class="cabecera-titulo" src="imagenes/titulo.png" alt="Comida tradicional alicantina" width="987" height="52" />
      <img class="cabecera-castillo" src="imagenes/castillo.svg" alt="" aria-hidden="true" />
    </a>
  </header>

  <div class="titulo-receta">
    <h1>Carrilleras al vino tinto</h1>
  </div>

  <div class="receta-wrapper">

    <div class="card-ingredientes">
      <h2>Ingredientes</h2>
      <ul class="ingredientes" data-sin-comensales>
        <li>Carrilleras</li>
        <li>1 cebolla picada</li>
        <li>2 dientes de ajo picados</li>
        <li>1 vaso de vino tinto</li>
        <li>2–3 cucharadas de tomate frito</li>
        <li>Sal, pimienta y aceite de oliva</li>
        <li class="sub">Opcional: una pizca de pimentón</li>
      </ul>
    </div>

    <div class="card-instrucciones">
      <h2>Preparación</h2>

      <div class="paso">
        <input type="checkbox" id="paso1" />
        <label for="paso1">
          <b>Dorar.</b> Salpimenta las <mark>carrilleras</mark>. En la <mark>olla a presión</mark> con aceite, dóralas bien por todos lados. Sácalas y resérvalas.
        </label>
      </div>

      <div class="paso">
        <input type="checkbox" id="paso2" />
        <label for="paso2">
          <b>Sofrito rápido.</b> En el mismo aceite, pocha la <mark>cebolla</mark> con una pizca de sal 8–10 minutos. Añade el <mark>ajo</mark> y remueve un poco. Si quieres, una pizca de <mark>pimentón</mark>. Añade el <mark>tomate frito</mark>.
        </label>
      </div>

      <div class="paso">
        <input type="checkbox" id="paso3" />
        <label for="paso3">
          <b>Guisar.</b> Vuelve a meter las carrilleras. Añade el <mark>vino tinto</mark> y deja hervir 2–3 minutos. Añade un poco de <mark>agua</mark>, solo hasta casi cubrir.
        </label>
      </div>

      <div class="paso">
        <input type="checkbox" id="paso4" />
        <label for="paso4">
          <b>A presión.</b> Cierra la olla: <mark>30–35 minutos</mark> desde que sube la presión.
        </label>
      </div>

    </div>

    <img class="imagen-receta" src="imagenes/carrilleras.jpg" alt="Carrilleras al vino tinto" />

  </div><!-- /receta-wrapper -->

  <footer class="pie-ondas">
    <img src="imagenes/ondas.svg" alt="" aria-hidden="true" />
  </footer>

  <script src="script.js?v=20261122d"></script>
</body>
