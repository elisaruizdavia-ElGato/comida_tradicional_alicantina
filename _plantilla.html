<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />

  <title>NOMBRE RECETA – Comida tradicional alicantina</title>
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Comida tradicional alicantina" />
  <meta property="og:title" content="NOMBRE RECETA – Comida tradicional alicantina" />
  <meta property="og:description" content="Platos de comida real, fácil, con ingredientes de supermercado y que solo manchan un recipiente." />
  <meta property="og:url" content="https://elisaruizdavia-elgato.github.io/comida_tradicional_alicantina/_plantilla.html" />
  <meta property="og:image" content="https://elisaruizdavia-elgato.github.io/comida_tradicional_alicantina/imagenes/compartir.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
        integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous" />
  <link rel="preload" href="fuentes/montserrat-alternates-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="style.css?v=20261124c" />
</head>
<body>

  <header class="cabecera con-menu">
    <a class="boton-menu" href="index.html" role="button" aria-label="Abrir el menú de recetas" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </a>
    <a class="cabecera-enlace" href="index.html">
      <img class="cabecera-rama" src="imagenes/rama.svg" alt="" aria-hidden="true" />
      <span class="cabecera-titulo"><span>Comida tradicional</span> <span>alicantina</span></span>
      <img class="cabecera-castillo" src="imagenes/castillo.svg" alt="" aria-hidden="true" />
    </a>
  </header>

  <!-- CAMBIAR: nombre de la receta -->
  <div class="titulo-receta">
    <a class="volver" href="index.html">‹ Todas las recetas</a>
    <h1>NOMBRE RECETA</h1>
  </div>

  <div class="receta-wrapper">

    <!-- ========================
         IMAGEN (opcional)
         Cambia src por la URL de tu imagen.
         Si no tienes imagen, borra este bloque.
    ========================= -->
    <img
      class="imagen-receta"
      src="URL_DE_TU_IMAGEN"
      alt="NOMBRE RECETA"
    />

    <!-- ========================
         INGREDIENTES
         Añade o quita <li> según necesites.
         Para subapartados (especias, etc.) añade class="sub" al <li>
    ========================= -->
    <div class="card-ingredientes">
      <h2>Ingredientes</h2>
      <ul class="ingredientes" data-comensales="2">
        <li>Ingrediente 1</li>
        <li>Ingrediente 2</li>
        <li>Ingrediente 3</li>
        <!-- Ejemplo subapartado: -->
        <!-- <li class="sub">Especias: laurel, pimentón</li> -->
      </ul>
    </div>

    <!-- ========================
         PASOS
         Duplica el bloque .paso para cada paso.
         Cambia id="pasoN" incrementando el número.
         Usa <mark>palabra clave</mark> para resaltar en amarillo.
    ========================= -->
    <div class="card-instrucciones">
      <h2>Preparación</h2>

      <div class="paso">
        <input type="checkbox" id="paso1" />
        <label for="paso1">
          <b>Título del paso.</b> Descripción del paso con <mark>ingredientes clave</mark> resaltados.
        </label>
      </div>

      <div class="paso">
        <input type="checkbox" id="paso2" />
        <label for="paso2">
          <b>Título del paso.</b> Descripción del paso con <mark>ingredientes clave</mark> resaltados.
        </label>
      </div>

      <!-- Añade más pasos copiando el bloque .paso de arriba -->

    </div>

  </div><!-- /receta-wrapper -->

  <footer class="pie-ondas">
    <img src="imagenes/ondas.svg" alt="" aria-hidden="true" />
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-OERcA2JD1N/z7y6/5OBU+cF1JigU2wRAKcF5dKTFJc0y2z8pp7rfH5G8pJfH/Xg" crossorigin="anonymous"></script>
  <script src="script.js?v=20261124c"></script>
</body>
</html>
