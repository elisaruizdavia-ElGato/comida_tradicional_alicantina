  <div class="titulo-receta">
    <a class="volver" href="index.html">‹ Todas las recetas</a>
    <h1>Gambas al ajillo</h1>
  </div>

  <div class="receta-wrapper">

    <img class="imagen-receta" src="imagenes/gambasalajillo.jpg" alt="Gambas al ajillo" />

    <div class="card-ingredientes">
      <h2>Ingredientes</h2>
      <ul class="ingredientes" data-comensales="2">
        <li>250 g de gambas peladas congeladas</li>
        <li>4 dientes de ajo</li>
        <li>Aceite de oliva (un buen chorro)</li>
        <li>Sal</li>
        <li class="sub">Opcional: guindilla y perejil picado</li>
      </ul>
    </div>

    <div class="card-instrucciones">
      <h2>Preparación</h2>

      <div class="paso">
        <input type="checkbox" id="paso1" />
        <label for="paso1">
          <b>Descongelar.</b> Pon las <mark>gambas</mark> en un colador dentro de un bol con <mark>agua fría</mark> (nunca caliente) 10–15 minutos. Nada de microondas, que se quedan gomosas.
        </label>
      </div>

      <div class="paso">
        <input type="checkbox" id="paso2" />
        <label for="paso2">
          <b>Secar muy bien.</b> Sécalas con <mark>papel de cocina</mark>, apretando un poco. Es el paso clave: si llegan mojadas se cuecen en vez de dorarse.
        </label>
      </div>

      <div class="paso">
        <input type="checkbox" id="paso3" />
        <label for="paso3">
          <b>El ajo.</b> En una sartén con bastante <mark>aceite de oliva</mark>, a fuego medio, echa el <mark>ajo</mark> en láminas o en trozos (y la guindilla si quieres) hasta que empiece a dorarse.
        </label>
      </div>

      <div class="paso">
        <input type="checkbox" id="paso4" />
        <label for="paso4">
          <b>Las gambas.</b> Sube el fuego al máximo y echa las gambas en una sola capa. <mark>1 minuto por cada lado</mark>, hasta que estén rosadas: si te pasas, quedan duras.
        </label>
      </div>

      <div class="paso">
        <input type="checkbox" id="paso5" />
        <label for="paso5">
          <b>Servir.</b> Sala al final, añade perejil si quieres y sirve enseguida con el <mark>aceite</mark> de la sartén, que es para mojar pan.
        </label>
      </div>

    </div>

  </div><!-- /receta-wrapper -->
