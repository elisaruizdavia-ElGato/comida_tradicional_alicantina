<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gazpacho manchego – Comida tradicional alicantina</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="cabecera con-menu">
    <a class="boton-menu" href="index.html" role="button" aria-label="Abrir el menú de recetas" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </a>
    <a class="cabecera-enlace" href="index.html">
      <img class="cabecera-titulo" src="imagenes/titulo.png" alt="Comida tradicional alicantina" width="987" height="52" />
      <img class="cabecera-castillo" src="imagenes/castillo.svg" alt="" aria-hidden="true" />
    </a>
  </header>

  <div class="titulo-receta">
    <h1>Gazpacho manchego</h1>
  </div>

  <div class="receta-wrapper">

    <div class="card-ingredientes">
      <h2>Ingredientes</h2>
      <ul class="ingredientes" data-comensales="2">
        <li>1 paquete de torta de gazpacho</li>
        <li>2 sobres de especias especiales de gazpacho (Mercadona)</li>
        <li>½ pimiento rojo</li>
        <li>¼ de conejo</li>
        <li>3 cucharadas de tomate frito</li>
        <li>2 dientes de ajo</li>
        <li>2 ramitas de romero fresco</li>
      </ul>
    </div>

    <div class="card-instrucciones">
      <h2>Preparación</h2>
      <div class="paso">
        <input type="checkbox" id="paso1" />
        <label for="paso1">
          <b>En la gazpachera.</b> Echar 2 cucharadas de <mark>aceite de oliva</mark> y cuando esté caliente
          echar el <mark>conejo</mark>, el <mark>pimiento</mark> y el <mark>ajo</mark> cortado en 2 mitades
          con la piel. Cuando esté dorado echar el <mark>tomate frito</mark>. Luego 1 litro de
          <mark>agua</mark> y 1 sobre de <mark>especias</mark>, tapar la olla. Dejar hervir flojito 30 min.
        </label>
      </div>
      <div class="paso">
        <input type="checkbox" id="paso2" />
        <label for="paso2">
          <b>Echar las tortas.</b> Echar el sobre de <mark>las tortas</mark> y el otro sobre de
          <mark>especias</mark>. Dejar 10 min más y apagar el fuego. Reposar 15 min.
        </label>
      </div>
    </div>

    <img class="imagen-receta" src="imagenes/gazpchomanchego.jpg" alt="Gazpacho manchego" />

  </div>

  <footer class="pie-ondas">
    <img src="imagenes/ondas.svg" alt="" aria-hidden="true" />
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-OERcA2JD1N/z7y6/5OBU+cF1JigU2wRAKcF5dKTFJc0y2z8pp7rfH5G8pJfH/Xg" crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>
</html>
